<!DOCTYPE html>
<html lang="sv"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LGIF Matcher 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --green: #1a7a3c; --green-light: #22a050; --green-dark: #145c2d;
  --gold: #f0c040; --bg: #f0f4f0; --card: #ffffff; --surface: #e8eee8;
  --text: #1a2a1a; --text2: #4a6a4a; --text3: #8aaa8a;
  --border: #d0ddd0; --orange: #e8820c; --radius: 16px;
  --shadow: 0 2px 12px rgba(0,80,0,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); font-family: 'Nunito', sans-serif; color: var(--text); }
.app-wrap { max-width: 960px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.app-header { background: linear-gradient(150deg, var(--green-dark) 0%, var(--green) 100%); color: #fff; padding: 18px 24px 14px; position: sticky; top: 0; z-index: 50; }
.header-top { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.club-badge { width:46px;height:46px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--green-dark); }
.header-titles { flex:1; }.header-title {font-size:20px;font-weight:900;}.header-sub {font-size:11px;opacity:.7;margin-top:1px;}
.hdr-btns {display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;}.hdr-btn {background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.38);color:#fff;border-radius:9px;padding:7px 12px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;}.hdr-btn.gold{background:var(--gold);border-color:var(--gold);color:var(--green-dark);}
.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}.filter-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.55)}.pills{display:flex;gap:6px;flex-wrap:wrap;}.pill{border:2px solid rgba(255,255,255,.28);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:800;color:rgba(255,255,255,.68);cursor:pointer}.pill.active{background:var(--gold);border-color:var(--gold);color:var(--green-dark)}
.update-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:5px 24px;font-size:11px;font-weight:700;color:var(--text3);display:flex;align-items:center;gap:7px}.update-dot{width:7px;height:7px;border-radius:50%;background:var(--green-light)}.unsaved-badge{background:var(--orange);color:#fff;font-size:10px;font-weight:900;padding:2px 7px;border-radius:5px}.tab-bar{background:var(--card);border-bottom:1px solid var(--border);display:flex;padding:0 24px;position:sticky;top:0;z-index:40}.tab{padding:12px 16px 10px;font-size:12px;font-weight:800;color:var(--text3);cursor:pointer;border-bottom:3px solid transparent;text-transform:uppercase}.tab.active{color:var(--green);border-bottom-color:var(--green)}
.content{flex:1;padding:14px 20px 60px}@media(min-width:680px){.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.month-label{grid-column:1/-1}}.month-label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);padding:16px 2px 6px}.month-label:first-child{padding-top:2px}
.match-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;border:1.5px solid transparent;transition:transform .12s,box-shadow .12s,border-color .12s;margin-bottom:10px}.match-card:hover{box-shadow:0 4px 18px rgba(0,80,0,.14);transform:translateY(-1px)}.match-card.expanded{border-color:var(--green-light)}.match-card.past{opacity:.52}.match-card.conflict{border-left:4px solid var(--orange)}.match-card.edited{border-top:3px solid var(--gold)}
/* 2012/2013 are intentionally visible but visually subdued. */
.match-card.youth-muted{opacity:.58;filter:saturate(.55)}.match-card.youth-muted:hover{opacity:.78;filter:saturate(.8)}
.card-main{display:flex;align-items:stretch}.team-stripe{width:6px;flex-shrink:0}.stripe-DAM{background:linear-gradient(180deg,#9b2246,#c43068)}.stripe-SVART{background:linear-gradient(180deg,#1a1a1a,#444)}.stripe-VIT{background:linear-gradient(180deg,#4a90d9,#2a70b8)}.stripe-2012,.stripe-2013{background:#b8c3b8}.card-body{flex:1;padding:10px 12px 9px;min-width:0}.card-row1{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px;gap:6px}.match-date{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;flex-shrink:0}.right-badges{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.team-badge{font-size:10px;font-weight:900;border-radius:5px;padding:2px 6px;text-transform:uppercase}.badge-DAM{background:#fce4ec;color:#9b2246}.badge-SVART{background:#f0f0f0;color:#222}.badge-VIT{background:#e3f0fb;color:#1a5a9a}.badge-2012,.badge-2013{background:#edf1ed;color:#718071}.card-row2{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}.opponent{font-size:15px;font-weight:800;color:var(--text);line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb-badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;text-transform:uppercase}.hb-hemma{background:#e8f5e9;color:#1b7a3c}.hb-borta{background:#fff3e0;color:#e65100}.card-row3{display:flex;align-items:center;gap:8px}.match-time{font-size:12px;font-weight:700;color:var(--green-dark);flex-shrink:0}.match-series{font-size:11px;color:var(--text2);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conflict-dot{width:8px;height:8px;background:var(--orange);border-radius:50%;flex-shrink:0}.trainer-row,.no-trainer{display:flex;align-items:center;gap:7px;padding:6px 12px;border-top:1px solid var(--surface);background:var(--surface)}.no-trainer{font-size:11px;color:var(--text3);font-style:italic}.trainer-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff}.trainer-name{font-size:12px;font-weight:700}.trainer-role{font-size:11px;color:var(--text3);font-weight:600;margin-left:auto}.card-detail{display:none;padding:12px 13px;border-top:1px solid var(--border);background:#fafffe}.card-detail.open{display:block}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}.detail-key{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--text3)}.detail-val{font-size:12px;font-weight:700}.edit-btn-row{display:flex;gap:7px;padding-top:6px;border-top:1px solid var(--border)}.edit-btn,.save-btn,.cancel-btn{border-radius:8px;padding:7px 12px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit}.edit-btn{background:var(--surface);border:1.5px solid var(--border)}.edit-btn.primary,.save-btn{background:var(--green);color:#fff;border:1.5px solid var(--green)}.edit-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.edit-form-full{grid-column:1/-1}.edit-label{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--text3);margin-bottom:4px;display:block}.edit-input,.edit-select,.edit-textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;font-weight:700}.edit-textarea{resize:vertical;min-height:64px}.edit-actions{display:flex;gap:8px}.next-badge{display:inline-block;background:var(--green);color:#fff;font-size:9px;font-weight:900;padding:2px 5px;border-radius:4px;margin-left:5px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
@media(max-width:440px){.app-header{padding:13px 14px 11px}.header-title{font-size:18px}.content{padding:10px 12px 50px}.tab-bar{padding:0 8px}.tab{padding:11px 10px 9px;font-size:11px}.update-bar{padding:5px 14px}.edit-form-grid{grid-template-columns:1fr}}
</style></head><body>
<div class="app-wrap"><div class="app-header"><div class="header-top"><div class="club-badge">L</div><div class="header-titles"><div class="header-title">Lindome GIF</div><div class="header-sub">Matchplanering 2026</div></div><div class="hdr-btns"><button class="hdr-btn" onclick="openModal('importOverlay')">Importera</button><button class="hdr-btn gold" onclick="openExport()">Publicera</button></div></div><div class="filter-row"><span class="filter-label">Lag:</span><div class="pills" id="teamPills"><div class="pill active" data-team="ALL" onclick="toggleTeam('ALL')">Alla</div><div class="pill" data-team="DAM" onclick="toggleTeam('DAM')">Dam</div><div class="pill" data-team="SVART" onclick="toggleTeam('SVART')">Svart</div><div class="pill" data-team="VIT" onclick="toggleTeam('VIT')">Vit</div><div class="pill" data-team="2012" onclick="toggleTeam('2012')">2012</div><div class="pill" data-team="2013" onclick="toggleTeam('2013')">2013</div></div></div></div><div class="update-bar"><span class="update-dot"></span><span id="updateText">Planering 2026 LGIF.xlsx · 24 Sep 2026 10:47 · 70 matcher</span><span id="unsavedBadge" class="unsaved-badge" style="display:none"></span></div><div class="tab-bar"><div class="tab active" onclick="showTab('kommande')">Kommande</div><div class="tab" onclick="showTab('alla')">Alla matcher</div><div class="tab" onclick="showTab('statistik')">Statistik</div></div><div class="content"><div id="matchGrid" class="match-grid"></div><div id="statsPanel" style="display:none"></div></div></div>
<script>
const LS_KEY='lgif_overrides_v1',MN=['Jan','Feb','Mar','Apr','Maj','Jun','Jul','Aug','Sep','Okt','Nov','Dec'],MF=['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'];
const WD={Måndag:'Mån',Tisdag:'Tis',Onsdag:'Ons',Torsdag:'Tor',Fredag:'Fre',Lördag:'Lör',Söndag:'Sön'};
let MATCHES=Array.from(document.querySelectorAll('#matchGrid .match-card')).map(()=>({}));
let overrides={},selTeams=new Set(['ALL']),curTab='kommande',expandedCards=new Set(),editingCard=null;
function matchId(m){return `${m.datum}_${m.lag}_${m.motstand}`};function today(){return new Date().toISOString().slice(0,10)};function fmtDate(d){let p=d.split('-');return `${+p[2]} ${MN[+p[1]-1]}`};function monthKey(d){let p=d.split('-');return `${MF[+p[1]-1]} ${p[0]}`};function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))};
function load(){try{overrides=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){}}function filtered(){let ms=MATCHES;if(!selTeams.has('ALL'))ms=ms.filter(m=>selTeams.has(m.lag));if(curTab==='kommande')ms=ms.filter(m=>m.datum>=today());return ms}
function toggleTeam(t){if(t==='ALL')selTeams=new Set(['ALL']);else{selTeams.delete('ALL');selTeams.has(t)?selTeams.delete(t):selTeams.add(t);if(!selTeams.size)selTeams=new Set(['ALL'])}document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active',selTeams.has(p.dataset.team)));render()};function showTab(t){curTab=t;document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('active',['kommande','alla','statistik'][i]===t));render()};function toggleCard(i){expandedCards.has(i)?expandedCards.delete(i):expandedCards.add(i);render()};
function render(){let grid=document.getElementById('matchGrid'),ms=filtered();if(curTab==='statistik'){grid.innerHTML='<div class="empty-state">📊 Statistik</div>';return}let html='',month='';ms.forEach((m,i)=>{let mo=monthKey(m.datum);if(mo!==month){month=mo;html+=`<div class="month-label">${esc(mo)}</div>`}let youth=m.lag==='2012'||m.lag==='2013',past=m.datum<today(),exp=expandedCards.has(i),trainer=m.ansvarig_ledare||'',conflict=m.krock==='JA';html+=`<div class="match-card${youth?' youth-muted ':''}${past?' past':''}${conflict?' conflict':''}${exp?' expanded':''}" onclick="toggleCard(${i})"><div class="card-main"><div class="team-stripe stripe-${esc(m.lag)}"></div><div class="card-body"><div class="card-row1"><span class="match-date">${esc(WD[m.veckodag]||m.veckodag||'')} ${fmtDate(m.datum)}</span><div class="right-badges"><span class="team-badge badge-${esc(m.lag)}">${esc(m.lag)}</span></div></div><div class="card-row2"><span class="opponent">${esc(m.motstand)}</span><span class="hb-badge ${m.hemma_borta==='Hemma'?'hb-hemma':'hb-borta'}">${m.hemma_borta==='Hemma'?'H':'B'}</span></div><div class="card-row3"><span class="match-time">🕐 ${esc(m.tid)}</span><span class="match-series">${esc(m.tavling||'')}</span>${conflict?'<div class="conflict-dot"></div>':''}</div></div></div>${trainer?`<div class="trainer-row"><div class="trainer-icon">${esc(trainer.slice(0,2).toUpperCase())}</div><span class="trainer-name">${esc(trainer)}</span><span class="trainer-role">Ansvarig ledare</span></div>`:'<div class="no-trainer">Ansvarig ledare: ej angiven</div>'}<div class="card-detail${exp?' open':''}"><div class="detail-grid"><div><div class="detail-key">Anläggning</div><div class="detail-val">${esc(m.anlaggning||'–')}</div></div><div><div class="detail-key">Hemma/Borta</div><div class="detail-val">${esc(m.hemma_borta||'–')}</div></div></div><div class="edit-btn-row"><button class="edit-btn primary" onclick="event.stopPropagation()">✏️ Redigera</button></div></div></div>`});grid.innerHTML=html||'<div class="empty-state">⚽ Inga matcher</div>'}
load();render();
</script></body></html>
